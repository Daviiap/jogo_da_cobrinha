<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobrinha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🐍 Cobrinha</h1>
  <div class="placar">
    <span>Pontos: <strong id="pontos">0</strong></span>
    <span>Recorde: <strong id="recorde">0</strong></span>
  </div>
  <div class="tela">
    <canvas id="jogo" width="400" height="400"></canvas>
    <div id="mensagem" class="mensagem">
      <p id="texto">Aperte uma seta para começar</p>
    </div>
  </div>
  <p class="dica">Use as setas ← ↑ → ↓ para mover · Espaço para pausar · As bordas levam para o outro lado</p>
  <script src="script.js"></script>
</body>
</html>
